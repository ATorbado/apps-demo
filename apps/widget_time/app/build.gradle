plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def weatherApiKey = providers.gradleProperty("WEATHER_API_KEY")
        .orElse(providers.environmentVariable("WEATHER_API_KEY"))
        .getOrElse("")
def visualCrossingApiKey = providers.gradleProperty("VISUAL_CROSSING_API_KEY")
        .orElse(providers.environmentVariable("VISUAL_CROSSING_API_KEY"))
        .getOrElse("")

android {
    namespace 'com.example.v5'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.v5"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "WEATHER_API_KEY", "\"${weatherApiKey}\""
        buildConfigField "String", "VISUAL_CROSSING_API_KEY", "\"${visualCrossingApiKey}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}


dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.squareup.picasso:picasso:2.8'
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")

    // required to avoid crash on Android 12 API 31
    implementation 'androidx.work:work-runtime-ktx:2.7.1'

}
